[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videokit"
version = "0.1.1"
description = "A beginner-friendly Python video editing library powered by FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dharshan" }]
keywords = ["video", "audio", "ffmpeg", "editing", "media"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dharshanlastone-tech/VideoKIT"
Repository = "https://github.com/dharshanlastone-tech/VideoKIT"
Issues = "https://github.com/dharshanlastone-tech/VideoKIT/issues"
Changelog = "https://github.com/dharshanlastone-tech/VideoKIT/blob/main/python-package/CHANGELOG.md"
"VS Code Extension" = "https://marketplace.visualstudio.com/items?itemName=dharshanlastone-tech.videokit"

[project.optional-dependencies]
release = ["build>=1.2", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videokit = ["py.typed"]
